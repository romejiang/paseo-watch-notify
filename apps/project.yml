name: PaseoNotify
options:
  bundleIdPrefix: com.romejiang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: PW3767GAB4
    CODE_SIGN_STYLE: Automatic
targets:
  PaseoNotify:
    type: application
    platform: iOS
    sources:
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romejiang.paseonotify
        PRODUCT_NAME: PaseoNotify
        # Explicit plist: Xcode's generated one injects UIRequiredDeviceCapabilities = [arm64],
        # which App Review rejects as a device requirement (Guideline 2.3). See iOS/Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: iOS/PaseoNotify.entitlements
    postBuildScripts:
      # Xcode 27 passes `-requiredArchitecture arm64` to builtin-infoPlistUtility for 64-bit-only
      # apps, which becomes `UIRequiredDeviceCapabilities = [arm64]`. App Review reads that as a
      # hardware requirement and rejects the build with Guideline 2.3 ("will not install on the
      # device used in review"). The app needs no special hardware, so drop the key before signing.
      - name: Remove injected UIRequiredDeviceCapabilities
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$PLIST" 2>/dev/null; then
            echo "note: removed injected UIRequiredDeviceCapabilities from $PLIST"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: PaseoNotify Watch App
        embed: true
    scheme:
      testTargets:
        - PaseoNotifyUITests
  PaseoNotify Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romejiang.paseonotify.watchkitapp
        PRODUCT_NAME: PaseoNotify
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Paseo Watch
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.romejiang.paseonotify
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        CODE_SIGN_ENTITLEMENTS: "PaseoNotify Watch App.entitlements"
    scheme:
      testTargets:
        - PaseoNotifyWatchUITests
  PaseoNotifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PaseoNotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romejiang.paseonotify.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PaseoNotify
  PaseoNotifyWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: PaseoNotify Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romejiang.paseonotify.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PaseoNotify Watch App
